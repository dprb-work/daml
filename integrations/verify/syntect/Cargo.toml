[workspace]
resolver = "3"

[package]
name = "daml-syntect-verify"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"
description = "Consumer-side verification of DAML's portable Syntect grammar"

[dev-dependencies]
syntect = { version = "=5.3.0", default-features = false, features = ["yaml-load", "regex-fancy", "default-themes"] }

[lints.rust]
unsafe_code = "forbid"
