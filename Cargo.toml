[package]
name = "daml"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Definitively Asserted Markup Language"
repository = "https://github.com/dprb-work/daml"
publish = false

[dependencies]
jsonschema = { version = "=0.59.0", default-features = false, features = ["arbitrary-precision"] }
pretty = { version = "=0.12.5", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
