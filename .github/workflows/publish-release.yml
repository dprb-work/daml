# Required release/platform gate and failure policy: see prepare-release.yml header.
name: Publish release
run-name: Publish ${{ inputs.version }} to ${{ inputs.publication_target }} from ${{ inputs.source_sha }} / manifest ${{ inputs.manifest_sha256 }}

on:
  workflow_dispatch:
    inputs:
      publication_target:
        description: Explicitly approve GitHub alone or GitHub plus PyPI publication
        required: true
        type: choice
        options:
          - github-only
          - github-and-pypi
      version:
        description: Exact coordinated release version (x.y.z)
        required: true
        type: string
      source_sha:
        description: Full qualified source SHA; must still be the current main tip
        required: true
        type: string
      prepare_run_id:
        description: Successful canonical prepare-release.yml main run ID (not Check preview)
        required: true
        type: string
      manifest_sha256:
        description: Approved SHA-256 of that preparation's RELEASE.json
        required: true
        type: string

permissions: {}

concurrency:
  group: daml-release-publication
  cancel-in-progress: false

env:
  RELEASE_TARGET: ${{ inputs.publication_target }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SOURCE: ${{ inputs.source_sha }}
  RELEASE_PREPARE_RUN: ${{ inputs.prepare_run_id }}
  RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}

jobs:
  preflight:
    name: Read-only admission before human approval
    if: github.repository == 'dprb-work/daml' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.admit.outputs.artifact_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # This job MUST NOT reference environment: release. A missing environment
      # otherwise gets auto-created without protections. The CLI reads and checks
      # the existing reviewer/self-review/main-only policy before scheduling it.
      - name: Admit exact immutable preparation and protected environment
        id: admit
        run: |
          python scripts/release_publish.py preflight \
            --publication-target "$RELEASE_TARGET" \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE" \
            --prepare-run-id "$RELEASE_PREPARE_RUN" \
            --manifest-sha256 "$RELEASE_MANIFEST_SHA256" \
            --out dist/preflight

  publish:
    name: Approve exact candidate and publish to ${{ inputs.publication_target }}
    needs: preflight
    if: >-
      github.repository == 'dprb-work/daml' && github.ref == 'refs/heads/main' &&
      needs.preflight.result == 'success' && needs.preflight.outputs.artifact_id != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/dprb-work/daml/releases
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Do not consume preflight workspace/artifacts: redownload the same
      # immutable preparation ID and revalidate all bytes after human approval.
      - name: Re-admit unchanged candidate and prepare registry wheels only if selected
        run: |
          wheel_args=()
          if [[ "$RELEASE_TARGET" == "github-and-pypi" ]]; then
            wheel_args=(--wheel-dir dist/pypi)
          fi
          python scripts/release_publish.py preflight \
            --publication-target "$RELEASE_TARGET" \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE" \
            --prepare-run-id "$RELEASE_PREPARE_RUN" \
            --manifest-sha256 "$RELEASE_MANIFEST_SHA256" \
            --artifact-id "$RELEASE_ARTIFACT_ID" \
            --out dist/release "${wheel_args[@]}"
      - name: Stage GitHub draft with all approved files
        id: draft
        run: |
          python scripts/release_publish.py stage-github \
            --publication-target "$RELEASE_TARGET" \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE" \
            --prepare-run-id "$RELEASE_PREPARE_RUN" \
            --manifest-sha256 "$RELEASE_MANIFEST_SHA256" \
            --artifact-id "$RELEASE_ARTIFACT_ID" \
            --bundle dist/release
      # Configure daml-config's pending/normal Trusted Publisher for owner
      # dprb-work, repo daml, workflow publish-release.yml, environment release.
      # Only the official PyPA action obtains OIDC credentials. No build, token
      # fallback, sidecars, sdist, or blanket skip-existing is permitted here.
      - name: Publish the approved wheels through PyPI Trusted Publishing
        if: inputs.publication_target == 'github-and-pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pypi/
          skip-existing: 'false'
      - name: Verify selected target effects and make only this staged release public
        env:
          RELEASE_DRAFT_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          python scripts/release_publish.py promote \
            --publication-target "$RELEASE_TARGET" \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE" \
            --prepare-run-id "$RELEASE_PREPARE_RUN" \
            --manifest-sha256 "$RELEASE_MANIFEST_SHA256" \
            --artifact-id "$RELEASE_ARTIFACT_ID" \
            --bundle dist/release --release-id "$RELEASE_DRAFT_ID"
      - name: Explain partial-effect recovery
        if: failure()
        run: |
          printf 'Publication target: %s\n' "$RELEASE_TARGET" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' \
            'Publication is non-atomic. A tag/draft/assets may exist; github-and-pypi may also leave some/all PyPI wheels.' \
            'Do not rerun, delete, overwrite, rebuild, or use skip-existing.' \
            'Use the read-only release_publish.py plan route with the original four candidate inputs and publication target.' \
            'Inspect exact public hashes and draft assets; obtain fresh owner authorization for remaining effects.' \
            >> "$GITHUB_STEP_SUMMARY"
