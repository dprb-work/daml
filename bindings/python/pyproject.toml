[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "daml"
dynamic = ["version"]
description = "Native Python bindings for DAML"
requires-python = ">=3.12"
license = "MIT"

[project.optional-dependencies]
types = ["pydantic>=2.14.2,<3"]

[dependency-groups]
dev = [
    "maturin==1.15.0",
    "pytest>=9,<10",
    "ruff==0.17.2",
    "pydantic>=2.14.2,<3",
    "msgspec==0.22.0",
]

[tool.maturin]
module-name = "daml.daml"
python-source = "python"
manifest-path = "Cargo.toml"
editable-profile = "dev"
locked = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
