# Keep the offline validator's dependency graph explicit and redistributable.
[advisories]
# No ignored advisories. `cargo deny check` refreshes the RustSec database.

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "MIT-0", "Zlib"]

[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["MIT", "Apache-2.0", "NCSA"]

[licenses.private]
# DAML remains unpublished pending an explicit project-license decision.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.features]]
crate = "jsonschema"
deny = ["resolve-http", "resolve-file", "resolve-async"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
