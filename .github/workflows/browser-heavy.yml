name: Browser SDK qualification

on:
  workflow_call:
    inputs:
      ref:
        description: Admitted immutable source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Install pinned Rust and browser build tools
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
          cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Install verified matching wasm-bindgen executable
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen.tar.gz"
          curl -fL 'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz' -o "$archive"
          printf '%s  %s\n' '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Install browser producer dependencies
        run: npm --prefix bindings/browser ci --ignore-scripts
      - name: Build and package the canonical release SDK
        run: |
          npm --prefix bindings/browser run build
          npm --prefix bindings/browser run package
      - name: Capture actual native parity results
        run: |
          cargo run --locked --manifest-path bindings/browser/Cargo.toml --example native-parity -- bindings/browser/verify/fixtures/native-parity.json > "$RUNNER_TEMP/native-parity.json"
      - name: Unpack the SDK for installed-artifact verification
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tarfile
          archives = list(pathlib.Path('bindings/browser/artifacts').glob('*.tgz'))
          if len(archives) != 1:
              raise SystemExit('Expected one newly produced browser SDK archive')
          with tarfile.open(archives[0], 'r:gz') as archive:
              archive.extractall(pathlib.Path(os.environ['RUNNER_TEMP']) / 'daml-browser-sdk', filter='data')
          PY
      - name: Install isolated browser verifier dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm --prefix bindings/browser/verify ci --ignore-scripts
      - name: Install the pinned verifier's Chromium
        working-directory: bindings/browser/verify
        run: |
          npx --no-install playwright install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright'; import { appendFileSync } from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH=' + chromium.executablePath() + '\\n');"
      - name: Typecheck the generated consumer against the packed SDK
        run: |
          consumer="$RUNNER_TEMP/daml-browser-sdk/package/verify"
          mkdir -p "$consumer"
          cp bindings/browser/verify/consumer.ts bindings/browser/verify/tsconfig.json "$consumer/"
          node bindings/browser/verify/node_modules/typescript/bin/tsc -p "$consumer/tsconfig.json"
      - name: Exercise the packed SDK in real Chromium
        run: node bindings/browser/verify/run.mjs --dist="$RUNNER_TEMP/daml-browser-sdk/package/dist" --native-result="$RUNNER_TEMP/native-parity.json"
      - name: Retain the qualified browser package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daml-browser-sdk
          path: bindings/browser/artifacts/*.tgz*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
