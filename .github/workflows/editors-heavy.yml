name: Editor integrations

on:
  workflow_call:
    inputs:
      ref:
        description: Admitted immutable checkout SHA; empty for standalone manual runs
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  vscode:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install VS Code integration dependencies
        working-directory: integrations/vscode
        run: npm ci --ignore-scripts
      - name: Audit VS Code integration dependencies
        working-directory: integrations/vscode
        run: npm audit --audit-level=high
      - name: Typecheck VS Code integration
        working-directory: integrations/vscode
        run: npm run typecheck
      - name: Package installable VSIX
        working-directory: integrations/vscode
        run: npm run package
      - name: Build locked DAML language server
        run: cargo build --locked --release --features lsp --bin daml-lsp
      - name: Install isolated Electron verifier dependencies
        working-directory: integrations/verify
        run: npm ci --ignore-scripts
      - name: Audit Electron verifier dependencies
        working-directory: integrations/verify
        run: npm audit --audit-level=high
      - name: Exercise DAML TextMate boundary scopes
        working-directory: integrations/verify
        run: npm run test:grammar
      - name: Exercise installed VSIX in real Electron extension hosts
        working-directory: integrations/verify
        env:
          DAML_LSP_PATH: ${{ github.workspace }}/target/release/daml-lsp
          DAML_VSCODE_NO_SANDBOX: '1'
        run: npm run test:vscode
      - name: Retain private VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: definitively-asserted-daml-vsix
          path: integrations/vscode/definitively-asserted-daml-0.1.0.vsix
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
