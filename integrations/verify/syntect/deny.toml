# This profile applies only to this unpublished consumer verifier, never DAML.
# User-approved exception: https://github.com/dprb-work/daml/issues/46#issuecomment-6752539695
# Additional locked-graph approval: https://github.com/dprb-work/daml/issues/46#issuecomment-6752772936
[advisories]
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "Syntect =5.3.0 requires yaml-rust 0.4.5 to load the exact .sublime-syntax asset. Approved only for this isolated nonshipping verifier; remove when upstream provides a maintained loader." },
    { id = "RUSTSEC-2025-0141", reason = "Syntect =5.3.0 parsing requires locked bincode 1.3.3. Approved only for this isolated nonshipping verifier after its complete advisory audit; remove when upstream removes this unmaintained dependency." },
]

[licenses]
# Unlike shipped graphs, this consumer's entire dependency closure is dev-only.
include-dev = true
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "MIT-0", "Zlib"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
