name: Editor integrations

on:
  workflow_call:
    inputs:
      ref:
        description: Admitted immutable checkout SHA; empty for standalone manual runs
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  vscode:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify installed editor and language-server behavior
        env:
          DAML_VSCODE_NO_SANDBOX: '1'
        run: ./scripts/check-tier editors
      - name: Retain private VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: definitively-asserted-daml-vsix
          path: |
            integrations/vscode/*.vsix
            integrations/vscode/*.vsix.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
