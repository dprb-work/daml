[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "daml-config"
dynamic = ["version"]
description = "Typed configuration schemas, defaults, and validation for DAML"
requires-python = ">=3.12"
license = "MIT"
readme = { text = """DAML (Definitively Asserted Markup Language) is an experimental configuration language.
Derive schemas from standard dataclasses or Pydantic models, resolve DAML documents,
and inspect validated dictionaries with completed defaults. Install the `types` extra
for Pydantic support. The distribution is `daml-config`; the Python import is `daml`.

See https://github.com/dprb-work/daml/blob/main/docs/python-quickstart.md for the
quickstart and https://github.com/dprb-work/daml/blob/main/docs/python.md for API
support and limitations. Resolved values are not constructed model instances.
""", content-type = "text/markdown" }
keywords = ["configuration", "validation", "dataclasses", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/dprb-work/daml"
Documentation = "https://github.com/dprb-work/daml/blob/main/docs/python.md"
Issues = "https://github.com/dprb-work/daml/issues"

[project.optional-dependencies]
types = ["pydantic>=2.14.2,<3"]

[dependency-groups]
dev = [
    "maturin==1.15.0",
    "pytest>=9,<10",
    "ruff==0.17.2",
    "pydantic>=2.14.2,<3",
    "msgspec==0.22.0",
]

[tool.maturin]
module-name = "daml.daml"
python-source = "python"
manifest-path = "Cargo.toml"
editable-profile = "dev"
locked = true
# Explicit inclusion bypasses gitignore for the producer's temporary legal payload.
# No matches is valid for ordinary source/editable installs.
include = [{ path = "python/daml/_distribution/*", format = "wheel" }]
# Source imports may warm these caches before a wheel build.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
