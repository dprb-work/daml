name: Binaries

on:
  workflow_call:
    inputs:
      ref:
        description: Admitted immutable checkout SHA; empty for standalone manual runs
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify native build target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          python -c 'import os,subprocess; host=next(line.removeprefix("host: ") for line in subprocess.check_output(["rustc","-vV"],text=True).splitlines() if line.startswith("host: ")); assert host == os.environ["EXPECTED_TARGET"], host'
      - name: Install pinned license notice generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Build and package native binaries
        run: python scripts/package-binaries.py --out dist
      - name: Verify and exercise the installed archive
        run: |
          python -c 'from pathlib import Path; import subprocess,sys; archives=[p for p in Path("dist").iterdir() if p.name.endswith((".tar.gz",".zip"))]; assert len(archives)==1, archives; subprocess.run([sys.executable,"skills/verify-daml-distribution/scripts/archive.py",str(archives[0])],check=True)'
      - name: Retain private binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daml-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
